; Lab power supply: Wemos D1 mini (ESP8266) driving a CentyLab RotoPD Pro (AP33772S + INA238)

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, send_on_enter
monitor_echo = yes
upload_speed = 921600

lib_deps =
    https://github.com/CentyLab/AP33772S-CentyLab.git#1.2.0
    robtillaart/INA238
    contrem/arduino-timer

; Over-the-air upload once the board is on Wi-Fi: pio run -e d1_mini_ota -t upload
; If OTA_PASSWORD is set in include/secrets.h, add: upload_flags = --auth=<password>
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = labpsu.local
